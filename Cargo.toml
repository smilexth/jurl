[package]
name = "jurl"
version = "0.1.0"
edition = "2021"
description = "A curl-like HTTP client written in Rust"
authors = ["jurl developers"]

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"
serde_json = "1.0"
mime = "0.3"
similar = "2.2"
console = "0.15"
futures = "0.3"
tokio = { version = "1.0", features = ["rt", "macros"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
